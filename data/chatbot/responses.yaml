safe_fallback: >-
  현재 문의 내용만으로는 정확한 안내를 드리기 어렵습니다. 필요한 경우 담당자가 확인 후 다시 안내드리겠습니다.
payment_fallback: >-
  결제 관련 문의는 계정 및 결제 내역 확인이 필요합니다. 담당자가 결제 상태와 지급 여부를 확인할 수 있도록 접수하겠습니다.
bug_fallback: >-
  게임 이용 중 발생한 문제는 기기 환경과 발생 상황 확인이 필요합니다. 담당자가 재현 정보와 로그를 확인할 수 있도록 접수하겠습니다.
faq_fallback: >-
  현재 문의 내용만으로는 정확한 안내를 드리기 어렵습니다. 필요한 경우 담당자가 확인 후 다시 안내드리겠습니다.
block_response: >-
  안전한 상담을 위해 해당 문의에는 자동 답변을 제공하기 어렵습니다. 필요한 경우 담당자가 확인 후 안내드리겠습니다.
review_required: '문의가 접수되었습니다. 담당자가 확인 후 안내드리겠습니다.'
payment_clarification: |-
  결제/환불 문의 내용을 조금 더 구체적으로 입력해 주세요.
  예: 결제 상품명, 결제 일시, 주문번호, 결제 플랫폼, 환불 또는 미지급 상황
