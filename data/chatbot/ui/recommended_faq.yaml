recommended_faq:
  payment:
  - question: 결제 후 아이템이 지급되지 않았습니다.
    answer: "결제 후 아이템이 지급되지 않았다면 결제 처리가 지연될 수 있으니 1~2시간 후에 다시 확인해 주세요.\n2시간이 지나도 아이템이 지급되지 않는 경우, 결제한 플랫폼에 따라 다음 방법을 시도해 주세요.\n\n1. Google Play Store 또는 Apple App Store\n   게임을 종료하고 백그라운드에서 실행 중인 게임도 종료한 후 다시 로그인하여 상점에 들어가 이전에 구입한 패키지를 선택해 주세요.\n   단, 결제를 다시 진행하지 마세요.\n\n2. PlayStation™Store\n   정확한 UID 계정에 충전되었는지 확인한 후, 게임을 종료하고 다시 로그인하여 상점 화면을 열어주세요.\n\n3. 기타 결제 경로\n   정확한 UID 계정에 충전되었는지, 환불 처리되지 않고 결제가 완료되었는지 확인해 주세요.\n\n위 방법으로도 문제가 해결되지 않으면 고객센터에 문의해 주세요."
  - question: 결제를 했는데 계정에 반영이 되지 않아요. 어떻게 해야 하나요?
    answer: "결제가 계정에 반영되지 않았을 경우, 사용한 결제 경로에 따라 다음 방법을 시도해 주세요.\n\n1. Google Play 또는 Apple Pay\n   결제 시 사용한 디바이스로 게임에 로그인한 후, 결제했으나 계정으로 지급되지 않은 상품을 선택하여 주문을 활성화해 주세요. 이때 결제를 다시 진행하지 않도록 주의해 주세요.\n\n2. Galaxy Store\n   결제 시 사용한 디바이스로 게임에 로그인한 후, 게임 내 상점으로 이동하여 주문을 활성화해 주세요.\n\n3. PlayStation™Store\n   결제 시 사용한 PlayStation™Network 계정과 연동된 HoYoverse 통행증이 맞는지, 계정이 소속된 지역과 서버가 일치하는지 확인해 주세요. 문제가 없으면 PlayStation® 디바이스를 재부팅하거나 게임 내 상점으로 이동하여 주문을 활성화해 주세요.\n\n4. Epic Games Center\n   결제 시 사용했던 Epic Games 계정으로 로그인한 후, Epic Games Center에서 게임에 로그인하여 주문을 활성화해 주세요.\n\n위 방법으로도 문제가 해결되지 않을 경우, 게임 타이틀 및 UID, 결제 경로, 주문서 번호 등의 정보를 기재하여 고객센터로 문의해 주세요."
  - question: 직접 승인하지 않은 결제에 대한 환불은 어떻게 신청하나요?
    answer: '직접 승인하지 않은 결제에 대한 환불은 결제를 진행한 플랫폼에 따라 절차가 다릅니다.


      App Store, Google Play 등 제삼자 플랫폼에서 결제한 경우 해당 플랫폼 고객센터에 환불 문의를 해 주세요.

      기타 제삼자 앱스토어의 경우에도 해당 앱스토어 고객센터로 문의해야 합니다.


      PC 클라이언트, 공식 홈페이지, PlayStation™Store 또는 기타 경로를 통해 결제한 경우에는 고객센터로 문의하거나 이메일로 연락해 주세요.


      일상: support@ilsang-game.com


      환불 정책은 이용자의 소재지, 연령, 결제 플랫폼 정책에 따라 다르게 적용될 수 있습니다.'
  - question: 웹페이지에서 결제를 하려면 어떻게 해야 하나요?
    answer: '아래 충전 페이지에서 본인의 계정으로 로그인하면 결제를 진행할 수 있습니다.


      결제 시 올바른 서버와 계정을 선택했는지 확인해 주세요.


      일상: https://support.ilsang-game.com


      궁금한 점이 있으면 고객센터로 문의해 주세요.'
  account:
  - question: 제 계정에 로그인할 수 없어요. 어떻게 해야 하나요?
    answer: '계정에 로그인할 수 없는 경우 다음 방법을 시도해 주세요.


      1. HoYoverse 통행증 공식 홈페이지에 방문하여 이메일이나 아이디를 정확하게 입력했는지 확인해 주세요.

      2. 비밀번호를 잊은 경우 비밀번호 찾기를 통해 비밀번호를 재설정해 주세요.

      3. Google, Apple ID, Facebook, X(Twitter) 등 제삼자 계정으로 로그인해 보세요.


      위 방법으로도 문제가 해결되지 않는다면 고객센터로 문의해 주세요.'
  - question: 계정에 로그인할 때 오류가 뜨는데 어떻게 해야 하나요?
    answer: "로그인 오류가 발생한 경우 오류 메시지에 따라 다음 방법을 시도해 주세요.\n\n1. “요청이 너무 빈번합니다. 잠시 후 다시 시도해 주세요” 오류\n   일정 시간 후 다시 시도해 주세요.\n\n2. “요청 실패, 현재 네트워크 환경이 위험합니다” 오류\n   네트워크 환경을 조정한 후 다시 시도해 주세요.\n\n3. “위험할 수 있는 조작입니다. 이메일을 통해 본인 인증을 해주세요” 오류\n   연동된 이메일에서 관련 메일을 확인해 주세요.\n\n위 방법으로도 문제가 해결되지 않는다면, 고객센터에 연락하여 시도한 방법을 알려주세요."
  - question: 계정에 로그인하고 보니 게임 진행도가 초기화됐는데 어떻게 해야 하나요?
    answer: "게임 진행도가 초기화된 것처럼 보이는 경우 다음 사항을 확인해 주세요.\n\n1. 올바른 서버 선택 확인\n   로그인 화면에서 올바른 서버가 선택되었는지 확인해 주세요. PlayStation®에서 접속할 경우 PlayStation™Network 계정의 지역 설정에 따라 다른 서버에 로그인될 수 있습니다.\n\n2. 올바른 계정으로 로그인했는지 확인\n   이메일 주소, 아이디, Google, X(Twitter), Facebook, Apple ID, Game Center, PlayStation™Network 등 로그인 방식이 정확한지 확인해 주세요.\n\n위 방법으로도 문제가 해결되지 않는다면 고객센터에 문의해 주세요."
  - question: 어떻게 하면 계정 보안을 강화할 수 있나요?
    answer: '계정 보안을 강화하려면 다음 방법을 권장합니다.


      1. 다른 계정과 중복되지 않는 보안성이 높은 비밀번호를 사용해 주세요.

      2. 장기간 사용할 수 있는 메일 주소를 계정에 연동해 주세요.

      3. Facebook, Google, Game Center, Apple, X(Twitter), PlayStation™Network 등 SNS 계정을 연동해 주세요.

      4. 계정 구매, 판매, 공유를 하지 마세요.

      5. 인증되지 않은 비공식 채널에서 결제하지 마세요.'
  - question: 낯선 사람이 제 계정에 로그인한 것 같아요. 어떻게 해야 하나요?
    answer: '낯선 사람이 계정에 로그인한 것 같다면 다음 조치를 진행해 주세요.


      1. HoYoverse 통행증 공식 홈페이지에서 비밀번호 찾기를 통해 비밀번호를 변경해 주세요.

      2. 연동된 메일과 휴대폰 번호가 변경되었는지 확인하고, 변경되었다면 본인의 정보로 다시 연동해 주세요.

      3. 로그인 디바이스 목록에서 타인의 디바이스가 등록되어 있는지 확인하고, 발견 시 삭제해 주세요.

      4. 위 작업을 할 수 없는 경우 계정 복구를 신청해 주세요.


      추가 도움이 필요하면 고객센터에 문의해 주세요.'
  reward:
  - question: 공월 축복 보상 원석을 받지 못했습니다.
    answer: '공월 축복 보상 원석을 받지 못한 경우, 먼저 공월 축복의 유효 시간을 확인해 주세요.


      유효 기간 내에 로그인하지 않으면 원석을 돌려받을 수 없습니다.

      유효 시간이 충분히 남아 있는데도 보상을 받지 못했다면 문제 피드백을 통해 문제를 보고해 주세요.'
  bug:
  - question: 버그, 튕김 관련 FAQ
    answer: '버그나 튕김 문제가 발생한 경우 다음 방법을 시도해 주세요.


      1. 게임 튕김 문제


      * 사용 중인 디바이스가 게임을 지원하는지 확인해 주세요.

      * 안정적인 네트워크 환경에서 게임 설치 파일을 다시 다운로드해 주세요.

      * 모바일 버전의 경우 공식 배포된 정식 운영체제를 사용 중인지 확인해 주세요.

      * PC 버전의 경우 그래픽카드 드라이버를 최신 버전으로 업데이트해 주세요.


      2. 로그 파일 제출


      * output_log.txt 및 output_log.txt.last 파일은 `%USERPROFILE%\AppData\LocalLow\miHoYo\ilsang-game` 경로에 저장됩니다.

      * DriverError.log 파일은 게임 설치 목록의 `ilsang-game\ilsang` 폴더에서 찾을 수 있습니다.


      문제가 지속될 경우 PC 버전 사용자는 output_log.txt 및 DriverError.log 파일을 첨부하고, 정확한 문제 발생 시간을 명시하여 고객센터로 문의해 주세요.

      모바일 버전 사용자는 문제가 발생한 디바이스를 사용해 고객센터로 문의해 주세요.'
  - question: 왜 접속이 끊기나요?
    answer: '접속이 끊기는 원인은 주로 네트워크 불안정이나 서버 상태와 관련될 수 있습니다.


      네트워크가 안정적인지 확인하고 서버 상태를 점검해 주세요.

      문제가 지속될 경우 문제 피드백을 통해 보고해 주세요.'
  notice:
  - question: 기원 이벤트 공용 FAQ
    answer: "기원 이벤트와 관련된 주요 안내는 다음과 같습니다.\n\n1. 중복 캐릭터 획득 시\n   동일한 ★5 캐릭터를 2번째부터 7번째까지 획득하면 운명의 별 1개와 주인 없는 스타라이트 10개를 받습니다.\n   8번째 이후부터는 주인 없는 운명의 별 1개와 주인 없는 스타라이트 25개로 전환됩니다.\n\n★4 캐릭터의 경우 2번째부터 7번째까지는 운명의 별 1개와 주인 없는 스타라이트 2개를 받고, 8번째 이후부터는 주인 없는 스타라이트 5개를 받습니다.\n\n2. 기원 확률 확인\n   기원 이벤트 화면의 왼쪽 하단에 있는 상세 버튼을 통해 확률 정보를 확인할 수 있으며, 공식 홈페이지에서도 관련 정보를 확인할 수 있습니다.\n\n3. 부산물 획득 및 사용\n   ★5 무기 획득 시 주인 없는 스타라이트 10개, ★4 무기 획득 시 2개, ★3 무기 획득 시 주인 없는 스타더스트 15개를 획득합니다.\n   주인 없는 스타더스트와 스타라이트는 상점에서 아이템 교환에 사용할 수 있습니다.\n\n4. 주인 없는 운명의 별\n   모든 운명의 자리가 활성화된 ★5 캐릭터의 운명의 별을 획득할 경우 주인 없는 운명의 별을 얻으며, 이를 사용해 캐릭터의 최대 레벨을 돌파할 수 있습니다.\n\n기타 자세한 사항은 각 기원 이벤트 공지를 참고해 주세요."
  voc:
  - question: 「기원」 뽑기 기록은 어떻게 확인하나요?
    answer: '기원 뽑기 기록은 게임 내에서 기원 메뉴로 이동한 후 뽑기 기록을 선택하면 확인할 수 있습니다.


      최근 1년 동안의 기원 기록을 확인할 수 있으며, 기록 반영에는 약 1시간의 딜레이가 있을 수 있습니다.

      1년 이전의 기록은 확인할 수 없지만, 이는 기원 천장 횟수에는 영향을 주지 않습니다.


      데이터가 로딩되지 않을 경우 잠시 후 다시 시도해 주세요.'
  - question: 월드 레벨/모험 등급 관련 FAQ
    answer: "월드 레벨과 모험 등급은 게임 내에서 서로 다른 개념입니다.\n\n1. 모험 등급\n   모험 등급은 게임 내 플레이어의 경험을 나타냅니다. 특정 레벨에 도달하면 모험 등급 돌파 임무를 완료해야 다음 레벨로 올라갈 수 있습니다.\n   모험 등급 Lv.60에 도달한 후에는 추가로 획득한 모험 경력이 모라로 전환됩니다.\n\n2. 월드 레벨\n   월드 레벨은 게임의 난이도를 조정하는 요소입니다. 월드 레벨 Lv.3에 도달한 후에는 페이몬 화면에서 월드 레벨을 1단계 하향 조정할 수 있습니다.\n   하향 후 24시간이 지나야 복원이 가능하며, 조정 후 24시간 동안은 다시 조정할 수 없습니다."
  - question: PC에서는 컨트롤러를 어떻게 연결하나요?
    answer: 'PC에서 컨트롤러를 연결하는 방법은 두 가지입니다.


      1. USB를 이용한 유선 연결

      2. 블루투스 또는 무선 어댑터를 이용한 무선 연결


      게임을 시작하기 전에 컨트롤러를 PC에 연결해야 합니다.

      Xbox 무선 컨트롤러, DualSense™ 무선 컨트롤러, DUALSHOCK®4 무선 컨트롤러가 PC에서 지원됩니다.


      자세한 연결 방법은 Xbox Support 또는 PlayStation Support를 참고해 주세요.'
  - question: 게임 최저 사양 및 권장 사양
    answer: '게임의 최소 사양 및 권장 사양은 플랫폼별로 다릅니다.


      안드로이드, iOS, PC, PlayStation®, Xbox 등 각 플랫폼의 최소 사양과 권장 사양을 확인해야 합니다.

      디바이스 성능이 낮거나 저장 공간이 부족한 경우 게임 설치 및 실행에 문제가 발생할 수 있습니다.


      PC 기준으로는 Windows 10 64-bit 이상, 충분한 RAM, 그래픽카드, DirectX 11, 저장 공간이 필요합니다.

      보다 원활한 실행을 위해 권장 사양을 충족하는 환경에서 플레이하는 것이 좋습니다.'
