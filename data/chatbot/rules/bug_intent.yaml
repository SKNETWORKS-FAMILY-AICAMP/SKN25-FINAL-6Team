bug_report_patterns:
  - '버그|오류|에러|error|bug|crash|크래시'
  - '튕|꺼지|종료|멈추|멈춤|먹통|프리징|로딩'
  - '안\s*(열|되|떠|보|나오|들어가|넘어가|움직|눌|켜)'
  - '열리지|되지\s*않|안\s*됩니다|안\s*돼|못\s*(받|하|들어가|열|넘어가)'
  - '완료\s*처리|처리\s*안|진행\s*안|다음\s*단계'
  - '두\s*번|중복|반복|계속\s*(돌|나오|뜨|발생)'
  - '카메라|컨트롤러|입력|채팅|링크|초대|보스|임무|퀘스트|그래픽|사운드'
  - '미지급|지급\s*안|우편.*안|보상.*안|가챠|뽑기|기록.*이상'

not_bug_patterns:
  - '환불\s*(처리|승인|취소|요청|해줘|해주세요)'
  - '결제\s*(취소|환불|처리|수단|방법)'
  - '비밀번호|계정\s*(복구|연동|탈퇴|찾기)|로그인\s*방법'
  - '공지|이벤트\s*(기간|보상|참여\s*방법)|업데이트\s*내용'
  - '건의|제안|불만|개선|의견'
