[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "common-python"
version = "0.1.0"
description = "Shared Python utilities for app backends"
requires-python = ">=3.11"
dependencies = [
  "langchain-core",
  "langchain-openai==1.1.3",
  "psycopg[binary]==3.3.4",
  "pydantic==2.12.5",
  "python-dotenv==1.2.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
