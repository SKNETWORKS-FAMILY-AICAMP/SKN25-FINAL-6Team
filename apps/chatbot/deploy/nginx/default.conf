server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;

    location = / {
        return 302 /dashboard/;
    }

    location = /chatbot {
        return 308 /chatbot/;
    }

    location = /chatbot/api {
        return 308 /chatbot/api/;
    }

    location ^~ /chatbot/api/ {
        rewrite ^/chatbot/api/(.*)$ /$1 break;
        proxy_pass http://chatbot-backend:8000;
    }

    location ^~ /chatbot/ {
        alias /app/apps/chatbot/frontend/static/;
        index index.html;
        try_files $uri $uri/ /chatbot/index.html;
    }

    location = /cs-auto {
        return 308 /cs-auto/;
    }

    location = /cs-auto/api {
        return 308 /cs-auto/api/;
    }

    location ^~ /cs-auto/api/ {
        rewrite ^/cs-auto/api/(.*)$ /$1 break;
        proxy_pass http://cs-auto-backend:8000;
    }

    location ^~ /cs-auto/ {
        alias /app/apps/cs_auto/frontend/static/;
        index index.html;
        try_files $uri $uri/ /cs-auto/index.html;
    }

    location = /dashboard {
        return 308 /dashboard/;
    }

    location = /dashboard/api {
        return 308 /dashboard/api/;
    }

    location ^~ /dashboard/api/ {
        rewrite ^/dashboard/api/(.*)$ /$1 break;
        proxy_pass http://dashboard-backend:8000;
    }

    location ^~ /dashboard/ {
        alias /app/apps/dashboard/frontend/static/;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }
}
