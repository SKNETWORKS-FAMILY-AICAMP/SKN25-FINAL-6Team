# 대시보드 백엔드 단독 운영 구성 (프론트엔드 제외)
#
# 실행 (프로젝트 루트 SKN25-FINAL-6Team/ 에서):
#   docker compose -f apps/weekly_report/deploy/docker-compose.yml up -d --build
#
# 필수 환경변수:
#   DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
#   DASHBOARD_SLACK_BOT_TOKEN
#   DASHBOARD_WEEKLY_REPORT_CHANNEL
#
# 주의: DB_HOST=localhost 는 컨테이너 내부에서 자기 자신을 가리킨다.
#       RDS 엔드포인트 또는 EC2 내부 IP를 사용해야 한다.

services:
  dashboard-backend:
    build:
      context: ../../..                                               # 프로젝트 루트
      dockerfile: apps/weekly_report/deploy/docker/python-app.Dockerfile
    image: skn25-dashboard-backend:latest
    container_name: dashboard-backend
    # EC2/서버 재시작 시 컨테이너를 자동으로 다시 올린다.
    # "컴퓨터가 꺼져도 돌아가게" 요구사항의 핵심 설정이다.
    restart: unless-stopped
    environment:
      # ── 데이터베이스 ───────────────────────────────────────────────
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-15}

      # ── Slack 정기발송 ─────────────────────────────────────────────
      DASHBOARD_SLACK_BOT_TOKEN: ${DASHBOARD_SLACK_BOT_TOKEN}
      # DASHBOARD_WEEKLY_REPORT_CHANNEL: 미설정 시 스케줄러가 시작되지 않는다.
      DASHBOARD_WEEKLY_REPORT_CHANNEL: ${DASHBOARD_WEEKLY_REPORT_CHANNEL}
      # DASHBOARD_WEEKLY_REPORT_COMMENT: PDF 업로드 시 함께 올라가는 텍스트 (선택)
      DASHBOARD_WEEKLY_REPORT_COMMENT: ${DASHBOARD_WEEKLY_REPORT_COMMENT:-}
      # DASHBOARD_WEEKLY_REPORT_AUTOSTART: 0 으로 스케줄러를 비활성화할 수 있다.
      DASHBOARD_WEEKLY_REPORT_AUTOSTART: ${DASHBOARD_WEEKLY_REPORT_AUTOSTART:-1}

      # ── LLM (AI 해석 사용 시) ─────────────────────────────────────
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}

    ports:
      # nginx 뒤에 두는 경우 이 포트는 내부 접근용이며 외부에 노출하지 않아도 된다.
      - "${DASHBOARD_BACKEND_PORT:-8000}:8000"

    healthcheck:
      # /health 엔드포인트가 200을 반환해야 nginx가 트래픽을 넘긴다.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s   # 앱 초기화 시간을 고려해 첫 체크를 20초 후 시작한다.

  dashboard-nginx:
    image: nginx:1.27-alpine
    container_name: dashboard-nginx
    restart: unless-stopped
    ports:
      - "${DASHBOARD_HTTP_PORT:-80}:80"
    volumes:
      # nginx 설정 파일을 읽기 전용으로 마운트한다.
      # /dashboard/api/ → dashboard-backend:8000 역방향 프록시가 이미 설정되어 있다.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dashboard-backend:
        # healthcheck를 통과한 뒤에 nginx를 시작해 503 방지
        condition: service_healthy
