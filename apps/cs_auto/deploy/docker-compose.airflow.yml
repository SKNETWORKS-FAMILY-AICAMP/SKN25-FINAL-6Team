name: cs-auto-airflow

services:
  airflow-postgres:
    image: postgres:16-alpine
    container_name: cs-auto-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    build:
      context: ../../..
      dockerfile: apps/cs_auto/deploy/docker/airflow-standalone.Dockerfile
    container_name: cs-auto-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    env_file:
      - ../../../.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__WEBSERVER__RBAC: "True"
      AIRFLOW_UID: "50000"
      PYTHONPATH: /opt/gameops/packages/common-python/src:/opt/gameops/apps/cs_auto/backend
    command: >
      bash -lc "airflow db migrate &&
      airflow users create --role Admin --username admin --password admin --firstname Airflow --lastname Admin --email admin@example.com || true"

  airflow-webserver:
    build:
      context: ../../..
      dockerfile: apps/cs_auto/deploy/docker/airflow-standalone.Dockerfile
    container_name: cs-auto-airflow-webserver
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - ../../../.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__WEBSERVER__RBAC: "True"
      AIRFLOW_UID: "50000"
      PYTHONPATH: /opt/gameops/packages/common-python/src:/opt/gameops/apps/cs_auto/backend
    ports:
      - "8080:8080"
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: bash -lc "airflow webserver"
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: ../../..
      dockerfile: apps/cs_auto/deploy/docker/airflow-standalone.Dockerfile
    container_name: cs-auto-airflow-scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - ../../../.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW_UID: "50000"
      PYTHONPATH: /opt/gameops/packages/common-python/src:/opt/gameops/apps/cs_auto/backend
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: bash -lc "airflow scheduler"
    restart: unless-stopped

volumes:
  airflow-postgres-data:
  airflow-logs:
