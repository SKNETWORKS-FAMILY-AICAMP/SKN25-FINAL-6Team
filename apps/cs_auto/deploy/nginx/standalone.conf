server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;

    location = / {
        return 308 /cs-auto/;
    }

    location = /cs-auto {
        return 308 /cs-auto/;
    }

    location = /cs-auto/api {
        return 308 /cs-auto/api/;
    }

    location ^~ /cs-auto/api/ {
        rewrite ^/cs-auto/api/(.*)$ /$1 break;
        proxy_pass http://cs-auto-backend:8000;
    }

    location ^~ /cs-auto/ {
        alias /usr/share/nginx/html/cs-auto/;
        index index.html;
        try_files $uri $uri/ /cs-auto/index.html;
    }
}
