server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;

    location = / {
        return 302 /cs-auto/;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location = /api/cs-auto {
        return 308 /api/cs-auto/;
    }

    location ^~ /api/cs-auto/ {
        proxy_pass http://127.0.0.1:8000/api/cs-auto/;
    }

    location = /cs-auto {
        return 308 /cs-auto/;
    }

    location = /cs-auto/ {
        return 302 /cs-auto/cs_automation.html;
    }

    location = /cs-auto/cs_automation.html {
        alias /app/apps/cs_auto/frontend/cs_automation.html;
        default_type text/html;
    }
}
