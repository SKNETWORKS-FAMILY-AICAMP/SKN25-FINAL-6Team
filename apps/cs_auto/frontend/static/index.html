<style>
@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap}

@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}

::-webkit-scrollbar{width:4px}

.fc { font-family:'Pretendard',sans-serif; }
.fc .fc-toolbar.fc-header-toolbar { margin-bottom: 0.2rem; }
.fc .fc-toolbar-title { font-size: 11px; font-weight: 600; color: #2a3340; }
.fc .fc-button { border: 1px solid #d8d2c4 !important; background: #fff !important; color: #4a5568 !important; box-shadow: none !important; }
.fc .fc-button:hover, .fc .fc-button:focus { background: #f7f5f0 !important; }
.fc .fc-button .fc-icon { font-size: 10px; }
.fc .fc-daygrid-day-number { font-size: 10px; color: #2a3340; padding: 1px 3px 0 0 !important; }
.fc .fc-col-header-cell-cushion { font-size: 9px; color: #8a9ab0; padding: 2px 0; }
.fc .fc-daygrid-day.fc-day-today { background: rgba(154,107,26,0.10) !important; }
.fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-number { color: #9a6b1a !important; font-weight: 700; }
.fc .fc-daygrid-day.review-selected-day { background: rgba(96,150,180,0.14) !important; }
.fc .fc-daygrid-day.review-selected-day .fc-daygrid-day-number { color: #426f86 !important; font-weight: 700; }
.fc .fc-daygrid-day-frame { min-height: 18px; }
.fc .fc-daygrid-day-top { min-height: 14px; }
.fc .fc-daygrid-day-events { display: none !important; }
.fc .fc-scrollgrid-section-body table,
.fc .fc-scrollgrid-section-header table { height: auto !important; }
.fc .fc-scrollgrid td, .fc .fc-scrollgrid th { padding: 0 !important; }
.login-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(42, 51, 64, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-overlay.hidden { display: none; }
.login-card {
  width: 340px;
  overflow: hidden;
  border: 1px solid #d8d2c4;
  border-radius: 14px;
  background: #fff;
}
.login-header {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 24px 28px 20px;
  background: #6096b4;
}
.lh-icon {
  display: flex;
  width: 36px;
  height: 36px;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
  font-size: 18px;
}
.lh-title { color: #fff; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
.lh-sub { color: rgba(255, 255, 255, 0.6); font-size: 11px; }
.login-body { padding: 22px 24px; }
.lf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lf-label {
  display: block;
  margin-bottom: 5px;
  color: #4a5568;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.lf-input {
  width: 100%;
  margin-bottom: 14px;
  border: 1px solid #d8d2c4;
  border-radius: 8px;
  background: #f7f5f0;
  padding: 9px 12px;
  color: #2a3340;
  font-family: "Pretendard", sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
.lf-input:focus { border-color: #6096b4; background: #fff; }
.login-err {
  display: none;
  align-items: center;
  gap: 5px;
  margin-bottom: 10px;
  border: 1px solid #f5c6c0;
  border-radius: 6px;
  background: #fdf0ee;
  padding: 6px 10px;
  color: #c0392b;
  font-size: 11px;
}
.login-err.show { display: flex; }
.login-btn {
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #6096b4;
  padding: 10px;
  color: #fff;
  font-family: "Pretendard", sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.13s;
}
.login-btn:hover { background: #4e84a0; }
.op-chip {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.15);
  padding: 5px 12px;
  cursor: pointer;
  transition: background 0.13s;
}
.op-chip:hover { background: rgba(255, 255, 255, 0.22); }
.op-avatar {
  display: flex;
  width: 22px;
  height: 22px;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.3);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
}
.op-name { color: #fff; font-size: 12px; font-weight: 600; }
.op-role { color: rgba(255, 255, 255, 0.6); font-size: 10px; }
.op-status-dot {
  width: 7px;
  height: 7px;
  flex-shrink: 0;
  border-radius: 9999px;
  background: #4ade80;
  box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.25);
}
.op-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 150;
  display: none;
  min-width: 180px;
  overflow: hidden;
  border: 1px solid #d8d2c4;
  border-radius: 9px;
  background: #fff;
}
.op-dropdown.open { display: block; }
.op-dropdown-header {
  padding: 10px 14px;
  border-bottom: 1px solid #d8d2c4;
  background: #f7f5f0;
}
.od-name { color: #2a3340; font-size: 13px; font-weight: 700; }
.od-role { color: #8a9ab0; font-size: 10px; }
.op-dropdown-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 14px;
  color: #4a5568;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s;
}
.op-dropdown-item:hover { background: #f7f5f0; }
.op-dropdown-item i { color: #6096b4; font-size: 15px; }
.op-dropdown-item.logout { color: #c0392b; }
.op-dropdown-item.logout i { color: #c0392b; }
</style>
<style type="text/tailwindcss">
@layer base {
  * { @apply box-border; }
  html, body { @apply h-full overflow-hidden bg-sand-50 font-sans text-[13px] leading-[1.5] text-ink-900; }
}
@layer components {
  .badge { @apply inline-flex h-[20px] w-[52px] items-center justify-center gap-1 overflow-hidden whitespace-nowrap rounded-full px-2 py-0 text-[10px] font-medium leading-none; }
  .panel { @apply flex min-h-0 flex-col overflow-hidden rounded-xl border border-sand-300 bg-white shadow-panel; }
  .section-head { @apply flex shrink-0 items-center gap-2 border-b border-sand-300 bg-white px-3.5 py-2.5; }
  .section-head h3 { @apply flex-1 text-[13px] font-bold text-ink-900; }
  .menu-tab { @apply flex cursor-pointer items-center gap-1.5 rounded-md border border-transparent bg-transparent px-3.5 py-1.5 text-xs font-medium text-white/65 transition hover:bg-white/10 hover:text-white; }
  .menu-tab.active { @apply bg-white/20 text-white; }
  .filter-chip { @apply cursor-pointer rounded-full border border-sand-300 bg-transparent px-2.5 py-1 text-[11px] font-medium text-ink-500 transition hover:border-brand-500 hover:text-brand-500; }
  .filter-chip.active { @apply border-brand-500 bg-brand-500 text-white; }
  .category-chip { @apply cursor-pointer rounded-full border border-sand-300 bg-sand-100 px-2.5 py-[3px] text-[11px] text-ink-500 transition; }
  .category-chip.active { @apply border-brand-500 bg-brand-500/10 font-medium text-brand-500; }
  .side-item { @apply flex cursor-pointer items-center gap-2 border-l-2 border-transparent px-4 py-1.5 text-xs font-medium text-ink-700 transition hover:bg-sand-200 hover:text-ink-900; }
  .side-item.active { @apply border-brand-500 bg-brand-500/10 text-brand-500; }
  .ticket-card { @apply mb-1 cursor-pointer rounded-lg border border-sand-300 bg-white px-3 py-2 transition hover:border-brand-300 hover:bg-brand-300/10; }
  .ticket-card.selected { @apply border-[1.5px] border-brand-500 bg-brand-500/5; }
  .subcard { @apply overflow-hidden rounded-[9px] border border-sand-300; }
  .subcard-editable { @apply overflow-visible; }
  .subcard-head { @apply flex items-center justify-between border-b border-sand-300 bg-sand-200 px-3 py-2; }
  .subcard-body { @apply bg-white px-3 py-2.5; }
  .btn { @apply inline-flex cursor-pointer items-center gap-1 rounded-[7px] border px-3 py-1.5 text-xs font-medium transition whitespace-nowrap; }
  .btn-primary { @apply border-brand-500 bg-brand-500 text-white hover:bg-brand-600; }
  .btn-ghost { @apply border-sand-300 bg-white text-ink-700 hover:border-brand-500 hover:text-brand-500; }
  .btn-danger { @apply border-alert-redBorder bg-alert-redBg text-alert-red hover:bg-[#fce8e5]; }
  .btn-success { @apply border-[#a7dfc3] bg-alert-greenBg text-alert-green hover:bg-[#d6f0e4]; }
  .btn-sm { @apply px-2.5 py-1 text-[11px]; }
}
</style>
