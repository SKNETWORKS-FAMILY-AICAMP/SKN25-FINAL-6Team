name: skn25-cs-auto

services:
  cs-auto-backend:
    build:
      context: ..
      dockerfile: apps/cs_auto/deploy/docker/cs-auto.Dockerfile
    image: skn25-cs-auto-backend:latest
    container_name: cs-auto-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-15}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      CS_AUTO_ROUTING_MODEL: ${CS_AUTO_ROUTING_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      CS_AUTO_REGENERATION_LIMIT: ${CS_AUTO_REGENERATION_LIMIT:-3}
      CS_AUTO_API_CORS_ORIGINS: ${CS_AUTO_API_CORS_ORIGINS:-*}
      CS_AUTO_CORS_ORIGINS: ${CS_AUTO_CORS_ORIGINS:-}
      NAVER_CAFE_COMMENT_ENDPOINT: ${NAVER_CAFE_COMMENT_ENDPOINT:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      OPERATION_LANGSMITH_TRACING: ${OPERATION_LANGSMITH_TRACING:-}
      OPERATION_LANGSMITH_API_KEY: ${OPERATION_LANGSMITH_API_KEY:-}
      OPERATION_LANGSMITH_PROJECT: ${OPERATION_LANGSMITH_PROJECT:-}
      CS_AUTO_UVICORN_HOST: 0.0.0.0
      CS_AUTO_UVICORN_PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/cs-auto/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shared

networks:
  shared:
    name: ${DEPLOY_SHARED_NETWORK:-skn25-shared}
    external: true
