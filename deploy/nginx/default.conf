server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;

    location = / {
        return 302 /chatbot/;
    }

    location = /chatbot {
        return 308 /chatbot/;
    }

    location = /chatbot/api {
        return 308 /chatbot/api/;
    }

    location ^~ /chatbot/api/ {
        proxy_pass http://chatbot-backend:8000/;
    }

    location ^~ /chatbot/ {
        alias /usr/share/nginx/html/chatbot/;
        index index.html;
        try_files $uri $uri/ /chatbot/index.html;
    }

    location = /cs-auto {
        return 308 /cs-auto/;
    }

    location = /cs-auto/api {
        return 308 /cs-auto/api/;
    }

    location ^~ /cs-auto/api/ {
        proxy_pass http://cs-auto-backend:8000/api/cs-auto/;
    }

    location = /cs-auto/ {
        return 302 /cs-auto/cs_automation.html;
    }

    location = /cs-auto/cs_automation.html {
        alias /usr/share/nginx/html/cs-auto/cs_automation.html;
        default_type text/html;
    }

    location = /cs-auto/api.js {
        alias /usr/share/nginx/html/cs-auto/api.js;
        default_type application/javascript;
    }
}
