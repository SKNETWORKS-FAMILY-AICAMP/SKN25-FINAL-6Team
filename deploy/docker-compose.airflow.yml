name: skn25-airflow

services:
  cs-auto-airflow:
    build:
      context: ..
      dockerfile: apps/cs_auto/deploy/docker/airflow.Dockerfile
    image: skn25-cs-auto-airflow:latest
    container_name: cs-auto-airflow
    restart: unless-stopped
    environment:
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Admin}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-User}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-15}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      CS_AUTO_ROUTING_MODEL: ${CS_AUTO_ROUTING_MODEL:-}
      CS_AUTO_KEYWORD_DIR: /opt/airflow/data/keywords
      CS_AUTO_SQL_DIR: /opt/airflow/data/sql
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      PYTHONPATH: /opt/airflow/dags:/opt/airflow/dags/apps/cs_auto/backend:/opt/airflow/dags/apps/weekly_report
      DASHBOARD_WEEKLY_REPORT_CHANNEL: ${DASHBOARD_WEEKLY_REPORT_CHANNEL:-}
      DASHBOARD_WEEKLY_REPORT_COMMENT: ${DASHBOARD_WEEKLY_REPORT_COMMENT:-}
      DASHBOARD_SLACK_BOT_TOKEN: ${DASHBOARD_SLACK_BOT_TOKEN:-}
      CS_AUTO_LANGFUSE_ENABLED: ${CS_AUTO_LANGFUSE_ENABLED:-}
      CS_AUTO_LANGFUSE_PUBLIC_KEY: ${CS_AUTO_LANGFUSE_PUBLIC_KEY:-}
      CS_AUTO_LANGFUSE_SECRET_KEY: ${CS_AUTO_LANGFUSE_SECRET_KEY:-}
      CS_AUTO_LANGFUSE_HOST: ${CS_AUTO_LANGFUSE_HOST:-}
      CS_AUTO_LANGFUSE_PROJECT: ${CS_AUTO_LANGFUSE_PROJECT:-cs-auto}
      WEEKLY_REPORT_LANGFUSE_ENABLED: ${WEEKLY_REPORT_LANGFUSE_ENABLED:-}
      WEEKLY_REPORT_LANGFUSE_PUBLIC_KEY: ${WEEKLY_REPORT_LANGFUSE_PUBLIC_KEY:-}
      WEEKLY_REPORT_LANGFUSE_SECRET_KEY: ${WEEKLY_REPORT_LANGFUSE_SECRET_KEY:-}
      WEEKLY_REPORT_LANGFUSE_HOST: ${WEEKLY_REPORT_LANGFUSE_HOST:-}
      WEEKLY_REPORT_LANGFUSE_PROJECT: ${WEEKLY_REPORT_LANGFUSE_PROJECT:-weekly-report}
    entrypoint: ["/bin/bash", "/usr/local/bin/start-airflow"]
    ports:
      - "${CS_AUTO_AIRFLOW_PORT:-18080}:8080"
    volumes:
      - cs_auto_airflow_logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", "airflow dags list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
volumes:
  cs_auto_airflow_logs:
