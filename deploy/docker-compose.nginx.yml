name: skn25-nginx

services:
  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    image: skn25-web-nginx:latest
    container_name: web-nginx
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    networks:
      - shared

networks:
  shared:
    name: ${DEPLOY_SHARED_NETWORK:-skn25-shared}
    external: true
