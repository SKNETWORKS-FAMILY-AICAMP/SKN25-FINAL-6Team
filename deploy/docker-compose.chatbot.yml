name: skn25-chatbot

services:
  chatbot-nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/chatbot.Dockerfile
    image: skn25-chatbot-nginx:latest
    container_name: chatbot-nginx
    restart: unless-stopped
    depends_on:
      - chatbot-backend
    ports:
      - "${CHATBOT_HTTP_PORT:-80}:80"
    networks:
      - chatbot

  chatbot-backend:
    build:
      context: ..
      dockerfile: apps/chatbot/backend/Dockerfile
    image: skn25-chatbot-backend:latest
    container_name: chatbot-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-15}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      CHATBOT_CORS_ORIGINS: ${CHATBOT_CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      CHATBOT_LANGSMITH_TRACING: ${CHATBOT_LANGSMITH_TRACING:-}
      CHATBOT_LANGSMITH_API_KEY: ${CHATBOT_LANGSMITH_API_KEY:-}
      CHATBOT_LANGSMITH_PROJECT: ${CHATBOT_LANGSMITH_PROJECT:-game_chatbot}
      CHATBOT_DEBUG_ROUTING: ${CHATBOT_DEBUG_ROUTING:-false}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - chatbot

networks:
  chatbot:
