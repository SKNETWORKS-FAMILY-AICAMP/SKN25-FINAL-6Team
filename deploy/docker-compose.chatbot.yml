name: skn25-chatbot

services:
  chatbot-nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/chatbot.Dockerfile
    image: skn25-chatbot-nginx:latest
    container_name: chatbot-nginx
    restart: unless-stopped
    depends_on:
      - chatbot-backend
    ports:
      - "${CHATBOT_HTTP_PORT:-80}:80"
    networks:
      - chatbot

  chatbot-backend:
    build:
      context: ..
      dockerfile: apps/chatbot/backend/Dockerfile
    image: skn25-chatbot-backend:latest
    container_name: chatbot-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-15}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      CHATBOT_CORS_ORIGINS: ${CHATBOT_CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      CHATBOT_LANGFUSE_ENABLED: ${CHATBOT_LANGFUSE_ENABLED:-}
      CHATBOT_LANGFUSE_PUBLIC_KEY: ${CHATBOT_LANGFUSE_PUBLIC_KEY:-}
      CHATBOT_LANGFUSE_SECRET_KEY: ${CHATBOT_LANGFUSE_SECRET_KEY:-}
      CHATBOT_LANGFUSE_HOST: ${CHATBOT_LANGFUSE_HOST:-}
      CHATBOT_LANGFUSE_PROJECT: ${CHATBOT_LANGFUSE_PROJECT:-chatbot}
      CHATBOT_DEBUG_ROUTING: ${CHATBOT_DEBUG_ROUTING:-false}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-chatbot}
      FAQ_RETRIEVAL_CACHE_ENABLED: ${FAQ_RETRIEVAL_CACHE_ENABLED:-false}
      FAQ_RETRIEVAL_CACHE_TTL: ${FAQ_RETRIEVAL_CACHE_TTL:-3600}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      GITHUB_ISSUE_LABELS: ${GITHUB_ISSUE_LABELS:-bug,in-game,chatbot}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - chatbot

networks:
  chatbot:
