services:
  nginx:
    image: nginx:1.27-alpine
    container_name: gameops-nginx
    ports:
      - "80:80"
    volumes:
      - .:/app:ro
      - ./apps/chatbot/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chatbot-backend
      - cs-auto-backend
      - dashboard-backend

  chatbot-backend:
    image: python:3.12-slim
    container_name: chatbot-backend
    working_dir: /app/apps/chatbot/backend
    command: >
      sh -lc "python -m pip install --upgrade pip &&
      python -m pip install -r requirements.txt &&
      python -m uvicorn api.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/packages/common-python/src:/app/apps/chatbot/backend
    volumes:
      - .:/app

  cs-auto-backend:
    image: python:3.12-slim
    container_name: cs-auto-backend
    working_dir: /app/apps/cs_auto/backend
    command: >
      sh -lc "python -m pip install --upgrade pip &&
      python -m pip install -r requirements.txt &&
      python -m uvicorn api.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/packages/common-python/src:/app/apps/cs_auto/backend
    volumes:
      - .:/app

  dashboard-backend:
    image: python:3.12-slim
    container_name: dashboard-backend
    working_dir: /app/apps/dashboard/backend
    command: >
      sh -lc "apt-get update &&
      apt-get install -y --no-install-recommends gcc libcairo2-dev pkg-config &&
      rm -rf /var/lib/apt/lists/* &&
      python -m pip install --upgrade pip &&
      python -m pip install -r requirements.txt &&
      python -m uvicorn api.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/packages/common-python/src:/app/apps/dashboard/backend
    volumes:
      - .:/app
